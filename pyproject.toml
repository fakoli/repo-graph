[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-graph-agent"
version = "0.4.0"
description = "Local repository diagrams and incremental semantic search for coding agents"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
semantic = ["fastembed==0.7.4", "numpy>=1.26,<3"]

[project.scripts]
repo-graph = "repo_graph.cli:main"

[tool.setuptools.packages.find]
include = ["repo_graph*"]

[tool.setuptools.package-data]
repo_graph = ["assets/*.html", "assets/*.js"]
