[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-graph-agent"
version = "0.6.0"
description = "Local repository diagrams and incremental semantic search for coding agents"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
semantic = ["fastembed==0.7.4", "numpy>=1.26,<3"]
analysis = [
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-go==0.25.0",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
]

[project.scripts]
repo-graph = "repo_graph.cli:main"

[tool.setuptools.packages.find]
include = ["repo_graph*"]

[tool.setuptools.package-data]
repo_graph = ["assets/*.html", "assets/*.js"]
